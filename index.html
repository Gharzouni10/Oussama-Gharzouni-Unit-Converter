<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oussama Gharzouni Unit Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--grid:#d9e3f2;--card:#fff;--ink:#13203a;--mute:#5a6a86;--line:#c5d2e6;--accent:#2457d6;--accent-ink:#fff;--out:#fff3c4;--out-ink:#3b2f00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--grid:#17233a;--card:#16213a;--ink:#e6ecf8;--mute:#93a3c2;--line:#2a3a5c;--accent:#6c97ff;--accent-ink:#0b1630;--out:#3a3210;--out-ink:#ffe9a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--grid:#17233a;--card:#16213a;--ink:#e6ecf8;--mute:#93a3c2;--line:#2a3a5c;--accent:#6c97ff;--accent-ink:#0b1630;--out:#3a3210;--out-ink:#ffe9a0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:14px}
.swap{width:auto;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.swap:disabled{opacity:.4;cursor:default}
@media(max-width:560px){.pick{grid-template-columns:1fr}.swap{justify-self:start}}
.hint{color:var(--mute);margin:0}
.ratio{font-family:"IBM Plex Mono",monospace;font-size:.9rem;margin:0 0 12px;color:var(--mute)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th{text-align:left;font-weight:600;padding:8px 6px;border-bottom:2px solid var(--ink);font-size:.95rem}
td{padding:5px 6px;border-bottom:1px solid var(--line)}
td input{font-family:"IBM Plex Mono",monospace}
.out{font-family:"IBM Plex Mono",monospace;background:var(--out);color:var(--out-ink);border-radius:6px;padding:9px 10px;min-height:42px;overflow-wrap:anywhere}
.out.bad{background:transparent;color:var(--mute);font-family:inherit}
h2{font-size:1.15rem;margin:0 0 4px;font-weight:600}
.calc{font-family:"IBM Plex Mono",monospace;font-size:.9rem;overflow-wrap:anywhere}
.note{color:var(--mute);font-size:.82rem;margin-top:2px}
.steps td{vertical-align:top;padding:8px 6px}
.steps table{min-width:560px}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
[hidden]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;direction:ltr}
.top h1{text-align:left}
.badge{font:600 .95rem/1 "IBM Plex Mono",monospace;letter-spacing:.08em;padding:8px 10px;border:2px solid var(--ink);border-radius:6px;white-space:nowrap}
.langs{display:flex;gap:6px;margin:0 0 14px;direction:ltr}
.langs button{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
html[lang="ar"] body{font-family:"Noto Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
.out,td input{direction:ltr;text-align:left}
.ladder table{width:auto;min-width:100%}
.ladder th,.ladder td{text-align:center;white-space:nowrap;padding:8px 10px;border:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:.9rem}
.ladder th{border-bottom:2px solid var(--ink)}
.ladder .lab{position:sticky;left:0;background:var(--card);text-align:left;font-family:inherit;font-weight:600;z-index:1}
.ladder .src{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.ladder .dst{background:var(--out);color:var(--out-ink)}
.ladder .path{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.calcs{list-style:none;padding:0;margin:12px 0 0;font-family:"IBM Plex Mono",monospace;font-size:.9rem;direction:ltr;text-align:left}
.calcs li{padding:3px 0;overflow-wrap:anywhere}
.note ul{margin:6px 0 0;padding-inline-start:1.2rem}
.note li{margin:6px 0}

.ladder table.school{width:auto;min-width:0;margin:0 auto;border-collapse:collapse}
.ladder table.school th{padding:8px 4px;border:2px solid var(--ink);font-size:1rem;text-align:center;font-family:inherit}
.ladder table.school td{width:2.1rem;min-width:2.1rem;height:2.3rem;padding:0;border:1px solid var(--ink);text-align:center;position:relative;font-size:1.05rem}
.ladder table.school td.cs{border-left:2px solid var(--ink)}
.ladder table.school td.d{font-weight:600;color:var(--accent)}
.ladder table.school td.z{color:var(--mute)}
.ladder table.school td.tp{box-shadow:inset -4px 0 0 var(--out-ink)}
.ladder table.school td.dp::after{content:attr(data-d);position:absolute;right:-.3em;bottom:-.25em;font-weight:700;color:var(--accent);z-index:2;font-size:1.3rem;line-height:1}
.ladder table.school th.tail{border:none}
body.locked #app{display:none}
body:not(.locked) #gate{display:none}
</style>
</head>
<body class="locked">
<div class="wrap">
  <div class="top">
    <h1>Oussama Gharzouni Unit Converter</h1>
    <span class="badge" title="Oussama Gharzouni Unit Converter">OGUC</span>
  </div>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en">English</button>
    <button data-lang="fr">Français</button>
    <button data-lang="ar">العربية</button>
    <button id="out" data-i="gOut" hidden></button>
  </div>
  <p class="sub" data-i="sub"></p>

  <div class="panel" id="gate">
    <h2 data-i="gTitle"></h2>
    <p class="hint" data-i="gSub" style="margin-bottom:10px"></p>
    <label for="email" data-i="gEmail"></label>
    <input id="email" type="email" autocomplete="email" inputmode="email" style="direction:ltr;text-align:left">
    <p class="hint" id="gErr" role="alert" style="color:#d64545;min-height:1.4em;margin:8px 0 0"></p>
    <div class="actions"><button class="btn" id="gBtn" data-i="gBtn"></button></div>
  </div>

  <div id="app">

  <div class="panel">
    <label for="cat" data-i="qty"></label>
    <select id="cat"></select>
    <div class="pick">
      <div><label for="from" data-i="from"></label><select id="from"></select></div>
      <button class="swap" id="swap" disabled>⇄</button>
      <div><label for="to" data-i="to"></label><select id="to"></select></div>
    </div>
  </div>

  <div class="panel" id="hintPanel"><p class="hint" data-i="hint"></p></div>

  <div class="panel" id="tablePanel" hidden>
    <p class="ratio" id="ratio"></p>
    <div class="scroll">
      <table>
        <thead><tr><th id="thFrom"></th><th id="thTo"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn" id="add" data-i="add"></button>
      <button class="btn alt" id="clear" data-i="clear"></button>
    </div>
  </div>

  <div class="panel ladder" id="ladderPanel" hidden>
    <h2 data-i="lTitle"></h2>
    <p class="hint" id="lIntroP" style="margin-bottom:10px"></p>
    <div class="scroll" dir="ltr"><table id="ladder"></table></div>
    <ul class="calcs" id="calcs"></ul>
  </div>

  <div class="panel note">
    <h2 data-i="nTitle"></h2>
    <ul><li data-i="nA"></li><li data-i="nB"></li></ul>
  </div>
  </div>
</div>

function fmt(v) {

}

  return fmt(r);
}

const NUM = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i;
function plain(t) {
  let m = String(t).trim().replace(",", ".").replace(/^[+-]/, "").toLowerCase(), e = 0;
  if (m.includes("e")) { const q = m.split("e"); m = q[0]; e = parseInt(q[1], 10); }
  const q = m.split("."), i = q[0] || "0", f = q[1] || "";

  if (p <= 0) { d = "0".repeat(1 - p) + d; p = 1; }
  if (p > d.length) d += "0".repeat(p - d.length);
  return { i: d.slice(0, p).replace(/^0+(?=\d)/, ""), f: d.slice(p).replace(/0+$/, "") };
}
const pow10i = k => k === 0 ? "1" : "10<sup>" + k + "</sup>";
function pickFam(fl, a, b) {

  return fl.find(f => has(f, a) && has(f, b)) || fl.find(f => has(f, a)) || fl.find(f => has(f, b)) || fl[0];
}

function renderSchool(a, b, fam) {
  const all = fam.m, sa = sym(a.n), sb = sym(b.n), dc = lang === "fr" ? "," : ".";
  const ia = all.findIndex(c => c.s === sa), ib = all.findIndex(c => c.s === sb), zi = all.findIndex(c => c.d === 0);
  const core = all.map((c, i) => c.x ? -1 : i).filter(i => i >= 0);
  let lo = Math.min(core[0], zi), hi = Math.max(core[core.length - 1], zi);
  [ia, ib].forEach(i => { if (i >= 0) { lo = Math.min(lo, i); hi = Math.max(hi, i); } });
  const cols = all.slice(lo, hi + 1).map(c => ({ s: c.s, e: c.d * fam.exp }));
  const w = cols.map((c, j) => j ? cols[j - 1].e - c.e : (cols.length > 1 ? c.e - cols[1].e : fam.exp));
  const refU = units().find(u => sym(u.n) === all[zi].s);

  const N0 = w.reduce((p, q) => p + q, 0);

  vals.forEach(s => {
    const t = s.trim().replace(",", ".");
    if (!NUM.test(t)) return;
    const x = Number(t);
    let src, ja;
    if (ia >= 0) { src = plain(t); ja = ia - lo; }
    else { src = plain(String(Number((Math.abs(a.to(x)) / refU.to(1)).toPrecision(10)))); ja = zi - lo; }
    const pf0 = rightIdx(ja);
    addL = Math.max(addL, src.i.length - 1 - pf0);
    addR = Math.max(addR, pf0 + src.f.length - (N0 - 1));
    rows.push({ x, neg: x < 0, src, ja });
  });

  const starts = new Set(); let acc = 0; w.forEach(q => { starts.add(acc); acc += q; });
  let head = "<thead><tr>" + cols.map((c, j) => '<th colspan="' + w[j] + '" class="' + (j + lo === ia ? "src" : j + lo === ib ? "dst" : "") + '">' + c.s + "</th>").join("") + (tail ? '<th colspan="' + tail + '" class="tail"></th>' : "") + "</tr></thead><tbody>";
  let body = "", lines = [];
  rows.forEach(r => {
    const pf = rightIdx(r.ja);
    r.src.f = r.src.f.slice(0, Math.max(0, N - 1 - pf));

    if (ib >= 0) {

      let ip = "", fp = "";
      for (let k = a0; k <= b0; k++) { const d = arr[k] || "0"; if (k <= pt) ip += d; else fp += d; }
      ip = ip.replace(/^0+(?=\d)/, ""); fp = fp.replace(/0+$/, "");
      res = (r.neg && /[1-9]/.test(ip + fp) ? "−" : "") + ip + (fp ? dc + fp : "");
    } else res = fmt(b.from(a.to(r.x)));
    body += "<tr>" + arr.map((d, k) => {
      let c = starts.has(k) ? "cs" : "", txt = d;
      if (d) c += " d"; else if (ib >= 0 && k >= a0 && k <= b0) { txt = "0"; c += " z"; }
      if (k === pf) c += " dp";
      if (k === pt) c += " tp";
      return '<td class="' + c + '" data-d="' + dc + '">' + txt + "</td>";
    }).join("") + "</tr>";
    const typed = (r.neg ? "−" : "") + r.src.i + (r.src.f ? dc + r.src.f : "");
    const from = ia >= 0 ? ia : zi;
    let line = ia >= 0 ? typed + " " + sa : fmt(r.x) + " " + sa + " = " + typed + " " + all[zi].s;
    if (ib >= 0 && ib !== from) line += " × " + pow10i((all[from].d - all[ib].d) * fam.exp);
    if (ib < 0 || ib !== from || ia >= 0) line += " = " + res + " " + sb;
    lines.push(line);

  $("ladder").className = "school";
  $("ladder").innerHTML = head + body + "</tbody>";
  $("calcs").innerHTML = lines.map(c => "<li>" + c + "</li>").join("");

const ALLOWED = (window.ALLOWED_EMAILS || []).map(s => String(s).trim().toLowerCase()).filter(Boolean);
async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function isAllowed(email) {
  const e = email.trim().toLowerCase();
  if (!e) return false;
  if (ALLOWED.includes(e)) return true;
  if (!(window.crypto && crypto.subtle)) return false;
  return ALLOWED.includes(await sha(e));
}
function setLocked(l) { document.body.classList.toggle("locked", l); $("out").hidden = l; }
async function tryLogin(email, manual) {
  let ok = false;
  try { ok = await isAllowed(email); } catch (e) {}
  if (ok) {
    if (manual) { try { localStorage.setItem("oguc-email", email.trim().toLowerCase()); } catch (e) {} }
    setLocked(false); $("gErr").textContent = "";
  } else {
    setLocked(true);
    try { localStorage.removeItem("oguc-email"); } catch (e) {}
    $("gErr").textContent = manual ? T("gErr") : "";
  }
  return ok;
}
$("gBtn").addEventListener("click", () => tryLogin($("email").value, true));
$("email").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin($("email").value, true); });
$("out").addEventListener("click", () => { try { localStorage.removeItem("oguc-email"); } catch (e) {} $("email").value = ""; setLocked(true); });
let savedEmail = ""; try { savedEmail = localStorage.getItem("oguc-email") || ""; } catch (e) {}
if (savedEmail) tryLogin(savedEmail, false);
applyLang();
</script>
